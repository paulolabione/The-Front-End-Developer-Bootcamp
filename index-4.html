<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Types</title>
  <link rel="stylesheet" href="style-4.css">

</head>
<body>
  <h1>Input Types</h1>

  <div id="container">
    <div>
      <form action="">
        <label for="name">Username</label><br>
        <input type="text" id="name" placeholder="Name"><br>
        <label for="pass">Password</label><br>
        <input type="password" id="pass" placeholder="Password"><br>
        <label for="email">Email</label><br>
        <input type="email" id="email" placeholder="Email"><br><br>
        <label for="">Gender</label>
        <input type="radio" name="gender" id="male"></input>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female"></input>
        <label for="female">Female</label><br><br>
        <label for="">Hobbies</label>
        <input type="checkbox" id="cricket" name="hobbies">
        <label for="cricket">Cricket</label>
        <input type="checkbox" id="football" name="#hobbies">
        <label for="football">Football</label><br><br>
        <label for="date" >Date of Birth</label>
        <input type="date" id="date"><br><br>
        <label for="file">Send CV</label>
        <input type="file" id="file">
        <input type="submit" value="Submit">

  
      </form>
   
    </div>
  </div>




  
</body>
</html>
